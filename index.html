<script type="text/javascript">
	const quoteHovers = document.querySelectorAll('.quote-hover');
	let currentTooltip = null;

	function showTooltip(e) {
		const tooltipId = e.currentTarget.getAttribute('data-tooltip');
		currentTooltip = document.getElementById(tooltipId);
		if (currentTooltip) {
			currentTooltip.style.left = e.clientX + 'px';
			currentTooltip.style.top = e.clientY + 'px';
			currentTooltip.classList.add('show');
		}
	}

	function hideTooltip() {
		if (currentTooltip) {
			currentTooltip.classList.remove('show');
			currentTooltip = null;
		}
	}

	quoteHovers.forEach(element => {
		element.addEventListener('mouseenter', showTooltip);
		element.addEventListener('mousemove', showTooltip);
		element.addEventListener('mouseleave', hideTooltip);
	});

	function getPostDate(url) {
		const match = url && url.match(/\/(\d{4})\/(\d{2})\/(\d{2})\//);
		return match ? `${match[1]}-${match[2]}-${match[3]}` : '';
	}

	function getCategoryPath(categories, index) {
		return categories
			.slice(0, index + 1)
			.map(category => encodeURIComponent(category.replace(/\s+/g, '-')))
			.join('/');
	}

	function createBlogCard({ title, url, categories = [], meta, delay }) {
		const card = document.createElement('article');
		card.className = 'blog-card glass-surface--refract';
		card.style.animationDelay = delay;
		card.tabIndex = 0;
		card.setAttribute('role', 'link');
		card.setAttribute('aria-label', title);

		const titleEl = document.createElement('div');
		titleEl.className = 'blog-card-title';
		titleEl.textContent = title;
		card.appendChild(titleEl);

		const footer = document.createElement('div');
		footer.className = 'blog-card-footer';

		if (categories.length > 0) {
			const tags = document.createElement('div');
			tags.className = 'blog-card-tags';

			categories.forEach((category, index) => {
				const tag = document.createElement('a');
				tag.className = 'blog-card-tag';
				tag.href = `/categories/${getCategoryPath(categories, index)}/`;
				tag.textContent = category;
				tag.addEventListener('click', event => event.stopPropagation());
				tags.appendChild(tag);
			});

			footer.appendChild(tags);
		}

		const metaEl = document.createElement('div');
		metaEl.className = 'blog-card-meta';
		metaEl.textContent = meta;
		footer.appendChild(metaEl);
		card.appendChild(footer);

		card.addEventListener('click', event => {
			if (event.target.closest('a')) return;
			window.location.href = url;
		});

		card.addEventListener('keydown', event => {
			if (event.target.closest('a')) return;
			if (event.key === 'Enter' || event.key === ' ') {
				event.preventDefault();
				window.location.href = url;
			}
		});

		return card;
	}

	window.addEventListener('load', function() {
		const grid = document.getElementById('blog-cards-grid');

		grid.appendChild(createBlogCard({
			title: 'About',
			url: '/about/',
			categories: ['About'],
			meta: 'Profile',
			delay: '0.4s'
		}));

		fetch('/searchdb.json')
			.then(response => response.json())
			.then(data => {
				const posts = data
					.filter(item => item.url && !item.url.includes('/about/'))
					.sort((a, b) => {
						const timeA = new Date(getPostDate(a.url)).getTime() || 0;
						const timeB = new Date(getPostDate(b.url)).getTime() || 0;
						return timeB - timeA;
					})
					.slice(0, 5);

				posts.forEach((post, index) => {
					grid.appendChild(createBlogCard({
						title: post.title || 'Untitled',
						url: post.url,
						categories: post.categories || [],
						meta: getPostDate(post.url),
						delay: `${0.4 + (index + 1) * 0.08}s`
					}));
				});
			})
			.catch(error => {
				console.error('Error loading posts:', error);
			});
	});
</script>
